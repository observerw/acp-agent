[project]
name = "acp-agent"
version = "0.0.1"
description = "A CLI tool to browse, search, and run ACP agents"
readme = "README.md"
authors = [
    { name = "observerw", email = "wozluohd@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
keywords = ["acp", "agent", "mcp", "cli", "agent-client-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aioshutil>=1.6",
    "attrs>=25.4.0",
    "cyclopts>=4.5.1",
    "httpx>=0.28.1",
    "httpx-ws>=0.8.2",
    "jinja2>=3.1.6",
    "litestar>=2.19.0",
    "loguru>=0.7.3",
    "platformdirs>=4.5.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "rich>=14.3.2",
]

[project.urls]
Repository = "https://github.com/observerw/acp-agent"

[project.scripts]
acp-agent = "acp_agent.cli:app"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"
